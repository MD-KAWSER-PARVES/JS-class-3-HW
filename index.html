<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Result sheet</title>
    <!-- CSS  -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <div class="container">
        <h2>Result sheet</h2>
        
        <div class="input-group">
            <label for="bangla"> (Bangla):</label>
            <input type="number" id="bangla" value="90" placeholder="">
        </div>

        <div class="input-group">
            <label for="english"> (English):</label>
            <input type="number" id="english" value="85" placeholder="">
        </div>

        <div class="input-group">
            <label for="math"> (Math):</label>
            <input type="number" id="math" value="95" placeholder="">
        </div>

        <div class="input-group">
            <label for="science"> (Science):</label>
            <input type="number" id="science" value="90" placeholder="">
        </div>

        <div class="input-group">
            <label for="socialScience"> (Social Science):</label>
            <input type="number" id="socialScience" value="85" placeholder="">
        </div>

        <button id="calc-btn">show result</button>

        <!-- result showing box -->
        <div id="result-container">
            <p id="result-text"></p>
        </div>
    </div>

    <!-- JavaScript  -->
    <script src="./assets/js/app.js"></script>
</body>
</html>
